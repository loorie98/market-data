name: collect-market-data
on:
  schedule:
    - cron: '35 21 * * 1-5'   # 한국 화~토 06:35 (미국 장 마감 뒤, 아침 보고 07:13 전)
    - cron: '35 11 * * 1-5'   # 한국 월~금 20:35 (밤 장 전 점검 21:30 전, 하루 늦게 나오는 자료 따라잡기)
  workflow_dispatch: {}        # 손으로 바로 실행하는 버튼
permissions:
  contents: write
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pandas lxml yfinance
      - run: python scripts/collect.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: commit
        run: |
          git config user.name "market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
