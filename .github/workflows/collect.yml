name: collect-market-data
# 이 파일은 거의 고칠 일이 없게 최소로 둠. 실제 작업(설치·수집·저장)은 scripts/run.sh 에 있어 Claude가 직접 고칠 수 있음.
on:
  schedule:
    - cron: '35 21 * * 1-5'   # 한국 화~토 06:35 (미국 장 마감 뒤, 아침 보고 07:13 전)
    - cron: '35 11 * * 1-5'   # 한국 월~금 20:35 (밤 장 전 점검 21:30 전)
  workflow_dispatch: {}        # 손으로 바로 실행하는 버튼
  push:                        # scripts/ 를 고치면 바로 한 번 실행
    branches: [main]
    paths: ['scripts/**']
permissions:
  contents: write
concurrency: { group: collect, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: bash scripts/run.sh
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
